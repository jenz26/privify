project:
  type: default
  output-dir: .
  render:
    - docs/technical_analysis.qmd

format:
  typst:
    template-partials:
      - docs/typst-template.typ
    papersize: a4
    fontsize: 11pt
    margin:
      top: 2.7cm
      bottom: 2.6cm
      left: 2.6cm
      right: 2.6cm
    mainfont: "New Computer Modern"
    sansfont: "DejaVu Sans"
    monofont: "DejaVu Sans Mono"
    linestretch: 1.05
    toc: true
    toc-depth: 2
    toc-title: "Contents"
    number-sections: true
    section-numbering: "1.1.1"
    columns: 1
    fig-pos: 'h'
    fig-cap-location: bottom
    tbl-cap-location: top
